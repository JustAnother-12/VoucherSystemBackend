spring.profiles.active=dev
spring.application.name=VoucherSystem
server.address=0.0.0.0
server.port=8080

#JWT
spring.config.import=optional:file:.env[.properties]
jwt.secret=${JWT_SECRET}
jwt.access-expiration-hours=${JWT_ACCESS_EXPIRATION:2}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION:7}

spring.jpa.properties.hibernate.type.json_format_mapper=jackson3

spring.jackson.property-naming-strategy=SNAKE_CASE