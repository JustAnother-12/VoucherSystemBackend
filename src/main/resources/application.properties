spring.application.name=VoucherSystem
server.address=0.0.0.0
server.port=8080
spring.config.import=optional:file:.env[.properties]

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-hours=${JWT_ACCESS_EXPIRATION_HOURS:2}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# database driver
spring.datasource.driver-class-name=org.postgresql.Driver

# migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# jpa
spring.jpa.hibernate.ddl-auto=validate

# jackson
spring.jpa.properties.hibernate.type.json_format_mapper=jackson3

# redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

#mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.no-reply=${MAIL_USERNAME:}