# Dedicated profile for local performance testing.
# Keep this profile separate from dev/test/prod.

spring.application.name=VoucherSystem-Performance

# PostgreSQL
spring.datasource.url=${PERF_DB_URL:jdbc:postgresql://localhost:5432/vouchersystem_perf}
spring.datasource.username=${DB_USERNAME:voucher_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Explicit starting pool values; tune only after observing Hikari/PostgreSQL metrics.
spring.datasource.hikari.maximum-pool-size=${PERF_DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${PERF_DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${PERF_DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=5000

# Apply the complete Flyway migration chain on first startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.validate-on-migrate=true

# Hibernate validates the schema created by Flyway; it must not create/update tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Redis (Spring Boot runs on Windows host in the recommended local setup).
spring.data.redis.host=${PERF_REDIS_HOST:localhost}
spring.data.redis.port=${PERF_REDIS_PORT:6380}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Local monitoring. Do not expose these endpoints publicly.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# Prevent accidental invocation of the destructive dev seeder.
app.seed.enabled=false
app.seed.allow-destructive=false
