# database config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2s

# jpa
spring.jpa.open-in-view=false

# One-time production demo seed. Disabled by default.
app.demo-seed.enabled=${APP_DEMO_SEED_ENABLED:false}
app.demo-seed.admin-username=${APP_DEMO_SEED_ADMIN_USERNAME:demo_admin}
app.demo-seed.admin-password=${APP_DEMO_SEED_ADMIN_PASSWORD:}
